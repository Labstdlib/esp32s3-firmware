/**
 * Get started with Arduino and ESP32-DevKitC:
 * Debugging and unit testing
 * This goal the demonstrate how simple it to use PlatformIO 
 * for VSCode develop,
 * 
 * - Level: Beginner
 * - Platforms: Windwos, MacOS X, Linux 
 * 
 * Requirements:
 * Downloaded and installed PlatformIO IDE for VSCode
 * Espressif ESP32 Dev Module
 * Olimex ARM-USB-OCD or Olimex ARM-USB-TINY adapter for debugging
 * 
 * Resource: https://docs.platformio.org/en/latest/tutorials/espressif32/arduino_debugging_unit_testing.html
 */


[env:esp32s3_vending]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D VENDING_FIRMWARE_VERSION=\"1.0.0\"

build_unflags =
    -std=gnu++11

build_flags +=
    -std=gnu++17

monitor_filters = esp32_exception_decoder